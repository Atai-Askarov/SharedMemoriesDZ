<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111">
<title>David &amp; Zoe — Wedding Photos</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif}
/* The welcome screen stays pullable so guests can refresh to the newest
   version. While the viewfinder is up, swallow the gesture — an accidental
   pull mid-shoot would reload the page and drop the camera. */
body.shooting{overflow:hidden;overscroll-behavior:none}
.screen{display:none;position:fixed;inset:0;flex-direction:column}
.screen.active{display:flex}

/* Welcome */
#welcome{
  background:#fdf6f4;align-items:center;justify-content:center;
  padding:40px 32px;text-align:center
}
#welcome-date{font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:#c08080;margin-bottom:14px}
#welcome h1{font-family:Georgia,'Times New Roman',serif;font-size:2.25rem;font-weight:400;color:#3d2626;margin-bottom:8px}
#welcome-tagline{color:#7a6060;font-size:0.9rem;line-height:1.5;margin-bottom:48px}
#start-btn{
  background:#c08080;color:#fff;border:none;border-radius:8px;
  padding:14px 0;width:100%;max-width:280px;
  font-size:1rem;font-weight:500;cursor:pointer;touch-action:manipulation
}
#start-btn:active{background:#a86868}
#welcome-note{margin-top:20px;max-width:300px;font-size:0.82rem;line-height:1.5;color:#a05656}

/* Session strip */
#strip{
  display:flex;gap:10px;align-self:stretch;
  margin-bottom:32px;padding:4px 2px;
  overflow-x:auto;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;scrollbar-width:none
}
#strip::-webkit-scrollbar{display:none}
.shot{
  flex:0 0 88px;height:88px;border-radius:10px;
  object-fit:cover;background:#f0e4e0;scroll-snap-align:start
}
#ghost{
  flex:0 0 88px;height:88px;border-radius:10px;
  border:2px dashed #e0c4bc;background:transparent;color:#c08080;
  font-size:1.6rem;line-height:1;cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center
}
#ghost:active{background:#f7ece8}
#pending{margin:-20px 0 24px;font-size:0.78rem;color:#a89090}

/* Camera */
#cam-screen{background:#000;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{display:none}

/* Controls */
#controls{
  position:absolute;bottom:0;left:0;right:0;
  padding:24px 28px calc(24px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,0.55);
  display:flex;align-items:center;justify-content:space-between
}
.ctrl-btn{
  width:44px;height:44px;flex-shrink:0;
  background:rgba(255,255,255,0.15);border:none;border-radius:8px;
  color:#fff;cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center
}
.ctrl-btn:active{background:rgba(255,255,255,0.3)}
#capture-btn{
  width:76px;height:76px;flex-shrink:0;
  background:#fff;border:5px solid rgba(255,255,255,0.4);border-radius:50%;
  cursor:pointer;touch-action:manipulation
}
#capture-btn:active{opacity:0.8}
#capture-btn:disabled{opacity:0.4;cursor:default}

/* Toast */
#toast{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  padding:7px 14px;background:rgba(0,0,0,0.72);color:#fff;
  border-radius:8px;font-size:0.85rem;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity 0.15s
}
#toast.show{opacity:1}
#toast.ok{background:rgba(22,163,74,0.92)}
#toast.err{background:rgba(220,38,38,0.92)}

/* Count */
#count{
  position:absolute;top:16px;right:16px;
  padding:4px 10px;background:rgba(0,0,0,0.5);color:#fff;
  border-radius:8px;font-size:0.8rem
}

/* Shutter flash */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>

<section id="welcome" class="screen active">
  <!-- Edit names and date here -->
  <p id="welcome-date">August 1, 2026</p>
  <h1>David &amp; Zoe</h1>
  <p id="welcome-tagline">Help us capture memories<br>from today</p>
  <div id="strip" role="list" aria-label="Photos you have taken">
    <button id="ghost" type="button" aria-label="Take your first photo">+</button>
  </div>
  <p id="pending" role="status" aria-live="polite" hidden></p>
  <button id="start-btn">Start capturing</button>
  <p id="welcome-note" hidden></p>
</section>

<section id="cam-screen" class="screen">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="flash" aria-hidden="true"></div>
  <span id="toast" role="status" aria-live="polite"></span>
  <span id="count" hidden></span>
  <footer id="controls">
    <button id="back-btn" class="ctrl-btn" aria-label="Go back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 5 5 12 12 19"/>
      </svg>
    </button>
    <button id="capture-btn" aria-label="Take photo"></button>
    <button id="flip-btn" class="ctrl-btn" aria-label="Flip camera">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
      </svg>
    </button>
  </footer>
</section>

<script>
const UPLOAD_URL   = 'https://script.google.com/macros/s/AKfycbzq5G7Ap28lgYywdL-zK1HrXRNPAkG6DACBEs2wCzQDAi7MB981bNtnxGCCIqqNtLVOTw/exec';
const JPEG_QUALITY = 0.85;
const MAX_SIDE     = 1920;
const GRANT_KEY    = 'sm-camera-granted';
// A browser cannot create an album on the phone, so the filename is what
// groups a guest's shots together wherever they land.
const GALLERY_NAME = 'David-Zoe-Wedding';
const DB_NAME      = 'shared-memories';
const META         = 'meta';    // id, name, thumbnail, sent flag
const BLOBS        = 'blobs';   // id -> full-size JPEG
const RETRY_MS     = 20000;   // how often a phone with unsent photos retries

let activeStream = null;
let facing       = 'environment';
let photoCount   = 0;
let switching    = false;
let toastTimer;

const video      = document.getElementById('video');
const canvas     = document.getElementById('canvas');
const toastEl    = document.getElementById('toast');
const countEl    = document.getElementById('count');
const flashEl    = document.getElementById('flash');
const captureBtn = document.getElementById('capture-btn');
const flipBtn    = document.getElementById('flip-btn');
const noteEl     = document.getElementById('welcome-note');
const stripEl    = document.getElementById('strip');
const ghostEl    = document.getElementById('ghost');
const pendingEl  = document.getElementById('pending');

let pendingCount = 0;

// Honest about what is still only on this phone, so a guest who leaves early
// knows there is something left to send.
function showPending(delta) {
  pendingCount = Math.max(0, pendingCount + delta);
  pendingEl.textContent = pendingCount === 1
    ? '1 photo still to upload'
    : pendingCount + ' photos still to upload';
  pendingEl.hidden = pendingCount === 0;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.body.classList.toggle('shooting', id === 'cam-screen');
}

function onCamScreen() {
  return document.getElementById('cam-screen').classList.contains('active');
}

// Leaving the viewfinder: release the camera and reset the session count.
function leaveCamera() {
  stopAllStreams();
  showScreen('welcome');
  photoCount = 0;
  countEl.hidden = true;
}

function showToast(msg, type) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.className = 'show' + (type ? ' ' + type : '');
  toastTimer = setTimeout(() => { toastEl.className = ''; }, 2500);
}

function showNote(msg) {
  noteEl.textContent = msg;
  noteEl.hidden = false;
}

function settingsOf(stream) {
  return stream?.getVideoTracks()[0]?.getSettings?.() || {};
}

async function videoInputs() {
  try {
    const list = await navigator.mediaDevices.enumerateDevices();
    return list.filter(d => d.kind === 'videoinput');
  } catch {
    return [];
  }
}

function openCamera(videoConstraints) {
  return navigator.mediaDevices.getUserMedia({
    video: Object.assign({ width: { ideal: MAX_SIDE } }, videoConstraints),
    audio: false
  });
}

async function attach(stream) {
  activeStream = stream;
  video.srcObject = stream;
  await video.play().catch(() => {});
}

function stopAllStreams() {
  activeStream?.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  activeStream = null;
}

// Push a history entry when the viewfinder opens, so the phone's back button
// has somewhere to land inside the app instead of leaving the site.
function enterCamera() {
  if (history.state?.screen !== 'camera') history.pushState({ screen: 'camera' }, '');
  showScreen('cam-screen');
}

async function startCamera() {
  // Reuse a stream that is already open so we never call getUserMedia twice.
  if (activeStream) { enterCamera(); return; }
  try {
    const s = await openCamera({ facingMode: 'environment' });
    await attach(s);
    facing = settingsOf(s).facingMode || 'environment';
    try { localStorage.setItem(GRANT_KEY, '1'); } catch {}
    noteEl.hidden = true;
    enterCamera();
  } catch (err) {
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    if (denied) {
      try { localStorage.removeItem(GRANT_KEY); } catch {}
      showNote('Camera access is blocked. Allow the camera for this site in your browser settings, then tap again.');
    } else {
      showNote('No camera is available on this device.');
    }
  }
}

async function flipCamera() {
  if (switching || !activeStream) return;
  switching = true;
  flipBtn.disabled = true;

  const prevId   = settingsOf(activeStream).deviceId || '';
  const prevFace = facing;
  const next     = facing === 'environment' ? 'user' : 'environment';

  const inputs = await videoInputs();
  if (inputs.length === 1) {
    showToast('Only one camera on this device', 'err');
    switching = false;
    flipBtn.disabled = false;
    return;
  }

  // Release the current camera before opening the other one. Many phones
  // refuse to hand out a second camera while the first track is still live,
  // and that rejection is what made the flip silently do nothing.
  stopAllStreams();

  // exact facingMode is the only form the browser must honour — the ideal
  // form is a hint and commonly returns the same camera back. deviceId is
  // the fallback for devices that label neither camera front/back.
  const other = inputs.find(d => d.deviceId && d.deviceId !== prevId);
  const plans = [{ facingMode: { exact: next } }];
  if (other) plans.push({ deviceId: { exact: other.deviceId } });
  plans.push({ facingMode: next });

  for (const plan of plans) {
    let s;
    try { s = await openCamera(plan); } catch { continue; }
    const id = settingsOf(s).deviceId || '';
    if (id && id === prevId) {          // handed back the same camera — not a flip
      s.getTracks().forEach(t => t.stop());
      continue;
    }
    await attach(s);
    facing = settingsOf(s).facingMode || next;
    switching = false;
    flipBtn.disabled = false;
    return;
  }

  // Nothing else would open — put the original camera back.
  try { await attach(await openCamera({ facingMode: prevFace })); } catch {}
  facing = prevFace;
  showToast('Could not switch camera', 'err');
  switching = false;
  flipBtn.disabled = false;
}

/* ---- Durable store -------------------------------------------------------
   A photo is written to IndexedDB before the network is ever involved, and is
   never deleted afterwards. Two reasons it is a permanent copy rather than an
   outbox: the guest keeps their own night, and — because the upload posts
   no-cors and so cannot read a reply — we can never actually prove a photo
   reached Drive. Deleting on an unprovable success would be how photos vanish.

   Full frames are stored as Blobs, not base64: a third smaller, which matters
   against Safari's storage quota over a few hundred shots.                  */

let db = null;

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      // Metadata and pixels live apart on purpose. Listing the night has to
      // read every metadata row, and if the full frame sat in the same record
      // that listing would drag hundreds of megabytes of JPEG into memory to
      // answer "which ones still need sending?".
      if (!d.objectStoreNames.contains(META))  d.createObjectStore(META, { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains(BLOBS)) d.createObjectStore(BLOBS, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

function request(store, mode, run) {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('no store'));
    const req = run(db.transaction(store, mode).objectStore(store));
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

// Thumbnails only — small enough that the whole night fits in memory.
const allMeta   = ()   => request(META,  'readonly', s => s.getAll());
const blobById  = (id) => request(BLOBS, 'readonly', s => s.get(id));

// One transaction across both stores, so a photo can never end up as a
// metadata row with no pixels behind it.
function savePhoto(meta, blob) {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('no store'));
    const t   = db.transaction([META, BLOBS], 'readwrite');
    const req = t.objectStore(META).add(meta);
    req.onsuccess = () => t.objectStore(BLOBS).put({ id: req.result, blob: blob });
    t.oncomplete  = () => resolve(req.result);
    t.onerror     = () => reject(t.error);
  });
}

function markSent(id) {
  return request(META, 'readonly', s => s.get(id)).then(rec => {
    if (!rec) return;
    rec.sent = 1;
    return request(META, 'readwrite', s => s.put(rec));
  });
}

function blobOf(b64) {
  const bin   = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: 'image/jpeg' });
}

function base64Of(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve(r.result.slice(r.result.indexOf(',') + 1));
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

/* ---- Upload queue --------------------------------------------------------
   Drained one photo at a time. A guest firing off ten shots used to spawn ten
   parallel megabyte uploads competing with each other and with every other
   phone in the room; sequential draining is the whole point of the queue.

   Note what a resolved fetch does and does not mean here: no-cors yields an
   opaque response that resolves for any status, including a rejection from
   Apps Script. So this can only detect the network being down, not the server
   turning us away. Photos are marked sent, never confirmed.                 */

let draining = false;

function postPhoto(name, b64) {
  return fetch(UPLOAD_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: name + '|' + b64
  });
}

async function drainQueue() {
  if (draining || !db) return;
  draining = true;
  try {
    const pending = (await allMeta()).filter(p => !p.sent);
    for (const rec of pending) {
      try {
        // Fetched one at a time: only the photo being sent is ever in memory.
        const row = await blobById(rec.id);
        if (!row) { await markSent(rec.id); continue; }   // pixels gone; nothing to send
        await postPhoto(rec.name, await base64Of(row.blob));
      } catch {
        break;   // connection is gone — leave the rest queued for the retry
      }
      await markSent(rec.id);
      showPending(-1);
    }
  } catch {
    /* store unreadable — the retry timer will come back round */
  } finally {
    draining = false;
  }
}

// Retry whenever the phone has a reason to think things changed, plus a slow
// timer for the case where nothing announces itself.
window.addEventListener('online', drainQueue);
document.addEventListener('visibilitychange', () => { if (!document.hidden) drainQueue(); });
setInterval(drainQueue, RETRY_MS);

// The strip keeps thumbnails, never the full frames — a guest who shoots all
// night would otherwise have a hundred megabytes of JPEG pinned in memory
// behind a row of 88px squares.
const THUMB_SIDE = 264;   // 88px at 3×, so it stays sharp on a phone screen

// Centre-cropped to a square, so portrait and landscape shots sit evenly in
// the row instead of the strip jumping about as the guest flips the camera.
function thumbnailOf(source) {
  const side = Math.min(source.width, source.height);
  const t = document.createElement('canvas');
  t.width = t.height = THUMB_SIDE;
  t.getContext('2d').drawImage(
    source,
    (source.width - side) / 2, (source.height - side) / 2, side, side,
    0, 0, THUMB_SIDE, THUMB_SIDE
  );
  return t.toDataURL('image/jpeg', 0.7);
}

// Newest first, so the shot a guest just took is the one they land on. The
// strip deliberately outlives leaving the viewfinder — it is the whole of what
// the welcome screen has to show, and resetting it on every back press would
// mean the home screen were always empty.
function addShot(src) {
  const img = document.createElement('img');
  img.className = 'shot';
  img.src = src;
  img.alt = '';
  img.setAttribute('role', 'listitem');
  stripEl.prepend(img);
  ghostEl.hidden = true;
  stripEl.scrollLeft = 0;
}

// Local date-time, so the guest's own gallery sorts the night in order.
function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

// Keep a copy on the phone as well as in Drive, so a guest still has their
// photos if the upload never lands — and so the couple are not the only
// people holding the night.
//
// This is deliberately called while the shutter tap is still the active
// gesture: Safari only honours a programmatic download inside one.
function saveToDevice(b64, filename) {
  try {
    const bin   = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    const url = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
    const a   = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // The download reads the blob asynchronously — revoking immediately would
    // pull it out from under a phone that has not started writing yet.
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) {
    // A failed local copy must never cost the guest the upload.
    showToast('Could not save to this device', 'err');
  }
}

function capture() {
  if (!activeStream || switching) return;
  const vw = video.videoWidth  || 1280;
  const vh = video.videoHeight || 720;
  let w = vw, h = vh;
  if (w > MAX_SIDE) { h = Math.round(h * MAX_SIDE / w); w = MAX_SIDE; }
  if (h > MAX_SIDE) { w = Math.round(w * MAX_SIDE / h); h = MAX_SIDE; }
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);

  const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
  const b64  = dataUrl.slice(dataUrl.indexOf(',') + 1);
  const name = 'photo-' + Date.now() + '.jpg';

  saveToDevice(b64, GALLERY_NAME + '-' + stamp() + '.jpg');
  const thumb = thumbnailOf(canvas);
  addShot(thumb);

  // Shutter flash
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.9';
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity 0.3s';
    flashEl.style.opacity = '0';
  });

  photoCount++;
  countEl.textContent = photoCount + (photoCount === 1 ? ' photo' : ' photos');
  countEl.hidden = false;

  // Store first, send after — the photo is safe on the phone before the
  // network is given a chance to lose it. The camera stays live throughout.
  showPending(1);
  savePhoto({ name: name, thumb: thumb, sent: 0, at: Date.now() }, blobOf(b64))
    .then(() => { showToast('Saved!', 'ok'); drainQueue(); })
    .catch(() => {
      // No durable store on this phone (private browsing, quota, old browser).
      // Fall back to the original straight-to-Drive post so the photo still
      // has its one chance, rather than being dropped for want of a database.
      showPending(-1);
      postPhoto(name, b64).then(() => showToast('Saved!', 'ok'))
                          .catch(() => showToast('Upload failed — try again', 'err'));
    });
}

document.getElementById('start-btn').addEventListener('click', startCamera);
// The empty-state card is the same invitation as the button below it.
ghostEl.addEventListener('click', startCamera);
// Both the on-screen arrow and the phone's back button take the same route,
// so the history entry is always consumed exactly once.
document.getElementById('back-btn').addEventListener('click', () => history.back());
window.addEventListener('popstate', () => { if (onCamScreen()) leaveCamera(); });

// A reload leaves a stale camera entry behind — the app always restarts on the
// welcome screen, so drop it or the first back press would appear to do nothing.
if (history.state?.screen === 'camera') history.replaceState(null, '');
captureBtn.addEventListener('click', capture);
flipBtn.addEventListener('click', flipCamera);

// The browser owns the permission grant and keeps it per-origin, so a
// returning guest who already allowed the camera is never prompted again —
// tapping Start just opens the stream. This only reflects that state in the
// UI: warn when the grant was revoked, and drop our cached flag to match.
// Bring back everything this phone has already taken. A guest who reloads, or
// who closed the tab and came back after dinner, finds their night intact and
// anything unsent still queued.
(async function restore() {
  try {
    db = await openDb();
  } catch {
    return;   // no store: capture() falls back to posting straight to Drive
  }
  try {
    const photos = (await allMeta()).sort((a, b) => a.id - b.id);
    photos.forEach(p => addShot(p.thumb));            // ascending, so newest ends up first
    showPending(photos.filter(p => !p.sent).length);
    drainQueue();
  } catch {
    /* nothing to restore */
  }
})();

(async function readGrant() {
  let state = '';
  try { state = (await navigator.permissions.query({ name: 'camera' })).state; } catch {}
  if (state === 'denied') {
    try { localStorage.removeItem(GRANT_KEY); } catch {}
    showNote('Camera access is blocked for this site. Allow it in your browser settings to join in.');
  } else if (state === 'granted') {
    try { localStorage.setItem(GRANT_KEY, '1'); } catch {}
  }
})();
</script>
</body>
</html>
